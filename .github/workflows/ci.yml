name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npx opennextjs-cloudflare build
      - name: Verify OpenNext bundle
        run: |
          test -f .open-next/worker.js
          test -d .open-next/assets
      # Blocking: runtime (production) dependencies must have no high/critical advisories.
      - run: npm audit --omit=dev --audit-level=high
      # Informational: dev tooling can carry advisories with no published fix yet
      # (e.g. braces via eslint-config-next). Keep it visible without blocking.
      - name: Full dependency audit (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e -- --project=chromium
      - run: npm run test:e2e -- --project=mobile
